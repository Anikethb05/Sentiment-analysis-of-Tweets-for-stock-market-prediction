<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Stock Price Prediction</h1>
        <p class="text-center mb-4">
            Welcome to our stock price prediction tool! Select a stock from the list below to get tomorrow's predicted price,
            view historical performance, and see the latest news and social media sentiment.
        </p>
        <form action="/predict/" method="GET" class="text-center">
            <div class="mb-3">
                <label for="stockSelect" class="form-label">Select Stock</label>
                <select class="form-select" id="stockSelect" name="stock" required>
                    <option value="" disabled selected>Choose a stock</option>
                    {% for stock in stocks %}
                    <option value="{{ stock }}">{{ stock }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Get Prediction</button>
        </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const stock = document.getElementById('stockSelect').value;
            if (stock) {
                window.location.href = `/predict/${stock}`;
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
